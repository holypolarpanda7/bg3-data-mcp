[project]
name = "bg3-data-mcp"
version = "0.1.0"
description = "Baldur's Gate 3 modding MCP server: layered game data, stats lint, Script Extender testing, Toolkit export"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
bg3-data-mcp = "bg3data.server:main"
bg3-data = "bg3data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bg3data"]
